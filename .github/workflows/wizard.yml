name: wizard images

# Builds the images the "wizard" home server runs:
#   ghcr.io/<owner>/cobalt-api:wizard   upstream imputnet/cobalt main + wizard/patches
#   ghcr.io/<owner>/cobalt-page:wizard  the Win98-style page in wizard/page
# Runs weekly so upstream fixes arrive without a manual merge.

on:
  push:
    branches: [wizard]
    paths:
      - "wizard/**"
      - ".github/workflows/wizard.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: wizard-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  UPSTREAM: imputnet/cobalt
  UPSTREAM_REF: main

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out wizard files
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream cobalt
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          fetch-depth: 1

      - name: Apply wizard patches
        run: bash fork/wizard/apply-patches.sh upstream

      - name: Image tags
        id: meta
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          version=$(jq -r .version upstream/api/package.json)
          upstream_sha=$(git -C upstream rev-parse --short HEAD)
          echo "api=${REGISTRY}/${owner}/cobalt-api" >> "$GITHUB_OUTPUT"
          echo "page=${REGISTRY}/${owner}/cobalt-page" >> "$GITHUB_OUTPUT"
          echo "api_tag=${version}-${upstream_sha}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build API candidate
        uses: docker/build-push-action@v6
        with:
          context: upstream
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.api_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=cobalt api (upstream ${{ env.UPSTREAM_REF }} + wizard patches)
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build page candidate
        uses: docker/build-push-action@v6
        with:
          context: fork
          file: fork/wizard/page.Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.page }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Win98-style downloader page for a cobalt api
          cache-from: type=gha,scope=page
          cache-to: type=gha,scope=page,mode=max

      - name: Test API candidate
        env:
          API_IMAGE: ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.api_tag }}
        run: |
          docker run --rm --network none \
            -e API_URL=http://127.0.0.1:9900/ -e API_PORT=9900 \
            -v "$PWD/fork/wizard/tests/api.test.mjs:/app/fixture.test.mjs:ro" \
            "$API_IMAGE" sh -c 'node --test --test-force-exit fixture.test.mjs src/processing/helpers/tests/captions.test.js test/*.test.js'

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test page candidate
        env:
          PAGE_IMAGE: ${{ steps.meta.outputs.page }}:${{ github.sha }}
        run: |
          npm install --prefix "$RUNNER_TEMP/wizard-tests" --no-audit --no-fund playwright-core@1.63.0
          "$RUNNER_TEMP/wizard-tests/node_modules/.bin/playwright-core" install --with-deps chromium webkit
          docker run -d --name wizard-test-page -p 127.0.0.1:9910:80 \
            -e API_URL=http://127.0.0.1:9911 "$PAGE_IMAGE"
          trap 'docker rm -f wizard-test-page >/dev/null' EXIT
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 --max-time 2 \
            http://127.0.0.1:9910/ -o /dev/null
          export NODE_PATH="$RUNNER_TEMP/wizard-tests/node_modules"
          node --test fork/wizard/tests/page.test.cjs
          WIZARD_WEBKIT=1 node --test fork/wizard/tests/page.test.cjs

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images
        env:
          API: ${{ steps.meta.outputs.api }}
          API_TAG: ${{ steps.meta.outputs.api_tag }}
          PAGE: ${{ steps.meta.outputs.page }}
        run: |
          docker push "$API:$API_TAG"
          docker push "$PAGE:$GITHUB_SHA"
          docker tag "$API:$API_TAG" "$API:wizard"
          docker tag "$PAGE:$GITHUB_SHA" "$PAGE:wizard"
          docker push "$API:wizard"
          docker push "$PAGE:wizard"
